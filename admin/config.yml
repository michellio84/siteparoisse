backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "actualites"
    label: "Actualités"
    folder: "content/actualites"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Titre", name: "title", widget: "string" }
      - { label: "Date de publication", name: "date", widget: "datetime" }
      - { label: "Image de couverture (facultative)", name: "image", widget: "image", required: false, hint: "Pour une vidéo Instagram, choisissez une image ou une capture qui servira d’aperçu sur le site." }
      - { label: "URL du Reel Instagram (facultative)", name: "instagram_url", widget: "string", required: false, hint: "Collez ici l’adresse complète du Reel, par exemple https://www.instagram.com/reel/..." }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Contenu", name: "body", widget: "markdown" }
      - { label: "Mettre en avant sur la page d’accueil", name: "featured", widget: "boolean", default: false, required: false }
      - { label: "Afficher sur l’accueil jusqu’au (facultatif)", name: "featured_until", widget: "datetime", required: false, hint: "Si ce champ reste vide, l’actualité demeure sur l’accueil jusqu’à ce que la case « Mettre en avant » soit décochée." }
    sort: "date:desc"
    summary: "{{title}} - {{date}}"

  - name: "agenda"
    label: "Agenda"
    folder: "content/agenda"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Titre", name: "title", widget: "string" }
      - { label: "Date de l’événement ou de publication", name: "date", widget: "datetime" }
      - { label: "Image", name: "image", widget: "image" }
      - { label: "URL du Reel Instagram (facultative)", name: "instagram_url", widget: "string", required: false, hint: "Collez ici l’adresse complète du Reel publié sur le compte Instagram de la paroisse." }
      - { label: "Lieu", name: "location", widget: "string" }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Mettre en avant sur la page d’accueil", name: "featured", widget: "boolean", default: false, required: false }
      - { label: "Afficher sur l’accueil jusqu’au (facultatif)", name: "featured_until", widget: "datetime", required: false, hint: "Si ce champ reste vide, le contenu demeure sur l’accueil jusqu’à ce que la case « Mettre en avant » soit décochée." }
    sort: "date:desc"
    summary: "{{title}} - {{date}}"

  - name: "annonces"
    label: "Annonces"
    folder: "content/annonces"
    create: true
    slug: "message"
    fields:
      - { label: "Message", name: "message", widget: "string" }
    summary: "{{message}}"

  - name: "albums"
    label: "Albums photos"
    folder: "content/albums"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Titre", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Lien Google Photos", name: "link", widget: "string" }
      - { label: "Image de couverture", name: "cover", widget: "image" }

  - name: "agenda_mfp"
    label: "Agenda MFP"
    folder: "content/mfp/agenda"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Titre", name: "title", widget: "string" }
      - { label: "Date de l'événement", name: "date", widget: "datetime", format: "YYYY-MM-DD HH:mm" }
      - { label: "Lieu", name: "lieu", widget: "string", required: false }
      - { label: "Description", name: "body", widget: "markdown" }
      - { label: "Affiche (optionnelle)", name: "affiche", widget: "image", required: false }

  - name: "affiches_mfp"
    label: "Affiches MFP"
    folder: "content/mfp/affiches"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Titre", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Affiche", name: "image", widget: "image" }
      - { label: "Description", name: "body", widget: "markdown" }

  - name: "temoignages_mfp"
    label: "MFP – Témoignages"
    label_singular: "Témoignage"
    description: "Témoignages pour la page MFP (Maisons Fraternelles de la Parole)"
    folder: "content/mfp/temoignages"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    media_folder: "static/images/mfp/temoignages"
    public_folder: "/images/mfp/temoignages"
    sortable_fields: ["date", "title"]
    fields:
      - { label: "Titre", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime", format: "YYYY-MM-DDTHH:mm:ssZ" }
      - { label: "Auteur", name: "auteur", widget: "string", required: false }
      - { label: "Extrait (court résumé)", name: "extrait", widget: "text", required: false }
      - { label: "Texte (markdown)", name: "body", widget: "markdown" }
      - { label: "Photo (optionnelle)", name: "image", widget: "image", required: false }
      - { label: "Lien vidéo (YouTube/Vimeo – optionnel)", name: "video", widget: "string", required: false }
      - { label: "Visible", name: "visible", widget: "boolean", default: true }

  - name: "video_sources"
    label: "Ressources – Sources vidéo"
    label_singular: "Source vidéo"
    folder: "content/videos/sources"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Nom", name: "title", widget: "string" }
      - { label: "URL YouTube de la chaîne ou playlist", name: "url", widget: "string" }
      - { label: "Type", name: "source_type", widget: "select", options: ["channel", "playlist"], default: "channel" }
      - { label: "Identifiant YouTube (optionnel)", name: "youtube_id", widget: "string", required: false, hint: "Laisser vide si l’URL contient déjà @nomdelachaine." }
      - { label: "Public", name: "audience", widget: "select", multiple: true, options: ["Tous", "Jeunes", "KT et catéchuménat", "Adultes"] }
      - { label: "Catégorie", name: "category", widget: "select", options: ["Découvrir la foi", "KT et catéchuménat", "Approfondir sa foi", "Bible", "Prière et vie chrétienne", "Questions pratiques"] }
      - { label: "Nombre maximal de nouveautés", name: "limit", widget: "number", default: 3, value_type: "int", min: 1, max: 6 }
      - { label: "Visible", name: "visible", widget: "boolean", default: true }

  - name: "video_selections"
    label: "Ressources – Sélection de la paroisse"
    label_singular: "Vidéo recommandée"
    folder: "content/videos/selections"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Titre", name: "title", widget: "string" }
      - { label: "URL YouTube", name: "url", widget: "string" }
      - { label: "Commentaire de la paroisse", name: "comment", widget: "text", required: false }
      - { label: "Public", name: "audience", widget: "select", multiple: true, options: ["Tous", "Jeunes", "KT et catéchuménat", "Adultes"] }
      - { label: "Catégorie", name: "category", widget: "select", options: ["Découvrir la foi", "KT et catéchuménat", "Approfondir sa foi", "Bible", "Prière et vie chrétienne", "Questions pratiques"] }
      - { label: "Mettre en avant", name: "featured", widget: "boolean", default: false }
      - { label: "Visible", name: "visible", widget: "boolean", default: true }
